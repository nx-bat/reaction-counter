services:
  bot:
    restart: unless-stopped
    build: .
    env_file: .env

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: